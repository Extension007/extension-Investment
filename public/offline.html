<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0A1F16">
  <title>Albamount — Offline</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: Poppins, system-ui, sans-serif; background: #0A1F16; color: #f6f1e4; text-align: center; padding: 24px;
    }
    h1 { font-size: 1.4rem; margin: 0 0 10px; color: #e8d5a3; }
    p { opacity: .85; line-height: 1.5; margin: 0 0 18px; max-width: 360px; }
    a, button {
      display: inline-block; padding: 12px 20px; border-radius: 10px; border: 0;
      background: linear-gradient(135deg, #1f8a5a, #c9a227); color: #fff; font-weight: 700; text-decoration: none; cursor: pointer;
    }
  </style>
</head>
<body>
  <div>
    <h1>No connection</h1>
    <p>Albamount needs the internet. Check your connection and try again.</p>
    <button type="button" onclick="location.href='/'">Retry</button>
  </div>
</body>
</html>
